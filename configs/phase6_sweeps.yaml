sweep_name: phase6
seed: 42

paths:
  split_csv: /home/maork/Projects/rad_sandbox/Sandbox/data/singerclassifier/processed/damp_sag_splits.csv
  output_root: /home/maork/Projects/rad_sandbox/Sandbox/singerclassifier/experiments
  generated_config_dir: /home/maork/Projects/rad_sandbox/Sandbox/data/singerclassifier/generated_configs/phase6
  manifest_csv: /home/maork/Projects/rad_sandbox/Sandbox/data/singerclassifier/manifests/phase6_sweep_manifest.csv
  manifest_json: /home/maork/Projects/rad_sandbox/Sandbox/data/singerclassifier/manifests/phase6_sweep_manifest.json

defaults:
  data:
    sample_rate: 22050
    duration_sec: 15.0
    n_fft: 1024
    hop_length: 512
    n_mels: 80
    f_min: 50.0
    f_max: 8000.0
    batch_size: 32
    num_workers: 2
    random_crop_train: true
    augment_train: false
    eval_num_crops: 1

  model:
    name: small_mel_cnn
    num_classes: 3
    dropout: 0.25
    classifier_dropout: 0.4

  training:
    epochs: 30
    learning_rate: 0.001
    weight_decay: 0.0001
    optimizer: adamw
    loss: cross_entropy
    class_weighted_loss: false
    early_stopping_metric: val_macro_f1
    early_stopping_patience: 7

  augmentation:
    enabled: false

  audio_cache:
    enabled: true
    cache_dir: /home/maork/Projects/rad_sandbox/Sandbox/data/singerclassifier/cache/audio_22050_mono
    strict: true

experiments:
  majority_baseline:
    family: majority_baseline
    type: baseline
    fixed:
      model:
        type: majority_class

  cnn_basic:
    family: cnn_basic
    type: train_eval
    fixed:
      data:
        augment_train: false
        eval_num_crops: 1
      training:
        class_weighted_loss: false
    sweep:
      training.learning_rate: [0.001, 0.0003]
      model.dropout: [0.25, 0.35]
      training.weight_decay: [0.0001]

  cnn_balanced:
    family: cnn_balanced
    type: train_eval
    fixed:
      data:
        augment_train: false
        eval_num_crops: 1
      training:
        class_weighted_loss: true
    sweep:
      training.learning_rate: [0.001, 0.0003]
      model.dropout: [0.25, 0.35]
      training.weight_decay: [0.0001]

  cnn_augmented:
    family: cnn_augmented
    type: train_eval
    fixed:
      data:
        augment_train: true
        eval_num_crops: 1
      training:
        class_weighted_loss: true
        weight_decay: 0.0001
      model:
        dropout: 0.25
    sweep:
      training.learning_rate: [0.001, 0.0003]
      augmentation.profile: [light, medium]

  cnn_augmented_multicrop:
    family: cnn_augmented_multicrop
    type: train_eval
    fixed:
      data:
        augment_train: true
      training:
        class_weighted_loss: true
        learning_rate: 0.0003
        weight_decay: 0.0001
      model:
        dropout: 0.25
      augmentation:
        profile: medium
    sweep:
      data.eval_num_crops: [3, 5]
